# ===== AI PR Review 助手 部署编排 =====
# 同机三项目隔离（见 BRIEF §3.4 / 复盘 D-10）：
#   - 独立 compose project name：pr-review
#   - 后端对外固定端口 8080（另两项目 8081 / 8082），仅绑 127.0.0.1 由 Caddy 反代
#   - 独立目录 /opt/pr-review
# 前端不进容器：vite build 产物由宿主机共享 Caddy 直接 file_server 托管，
# Caddy 把 /api/* 反代到本服务 8080（见 deploy/pr.caddy）。

name: pr-review

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: pr-review-backend:latest
    container_name: pr-review-backend
    restart: unless-stopped
    # 只绑回环：外部一律走 Caddy 443，容器端口不直接暴露公网
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8080/api/health').status==200 else sys.exit(1)"
      interval: 30s
      timeout: 5s
      retries: 3
